name: TypeScript and WebGL game checks

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Clear captures from earlier review iterations
        # Existing review images are tracked. Publish only images generated by
        # this runner, also if build or unit validation fails before the browser.
        run: rm -f artifacts/*.png
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript and standalone production build
        run: npm run build:standalone
      - name: Unit and physics regression tests
        run: npm test
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select the Chromium installed by Playwright
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${chromium.executablePath()}\n`);
          JS
      - name: Browser, WebGL and offline regression tests
        run: npm run test:visual -- --reporter=line,html --trace=retain-on-failure
      - name: Upload standalone build, browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-validation-${{ github.run_id }}
          path: |
            artifacts/*.png
            artifacts/SKYLIFT-0.9.html
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
