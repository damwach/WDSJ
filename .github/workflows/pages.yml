name: Publish SKYLIFT to GitHub Pages

on:
  push:
    branches: [main, "preview/skylift-0.11"]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: Commit SHA or ref to preview; leave empty to publish this workflow's commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  revision:
    name: Select one immutable commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.preview_ref || github.sha }}
      - name: Pin the selected revision for validation and build
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: revision
    uses: ./.github/workflows/game-checks.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}

  build:
    needs: [revision, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
